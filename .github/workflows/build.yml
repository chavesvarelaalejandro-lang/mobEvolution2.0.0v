name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Descomprimir el zip del proyecto
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No hay ningun .zip en la raiz del repositorio"
            exit 1
          fi
          echo "Usando $ZIP"
          mkdir -p proyecto
          unzip -q -o "$ZIP" -d proyecto
          GRADLE_FILE=$(find proyecto -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "El zip no contiene build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
